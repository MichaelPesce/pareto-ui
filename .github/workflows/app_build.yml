name: App build
run-name: PARETO UI Build
on:
  workflow_call:
    inputs:
      job-name:
        type: string
      os-version:
        type: string
        default: windows-latest
      project-pareto-repo:
        type: string
        default: project-pareto/project-pareto
      project-pareto-branch:
        type: string
        default: main
      project-pareto-version:
        type: string
        default: '1.1.0'
      sign-distribution:
        type: boolean
        default: true
      debug-oidc-claims:
        type: boolean
        default: false
      package-build-number:
        type: string
      windows-installer-target:
        type: string
        default: nsis
      gcp-code-signing-project-id:
        type: string
        default: ''
      gcp-code-signing-workload-identity-provider:
        type: string
        default: ''
      gcp-code-signing-service-account:
        type: string
        default: ''
      gcp-code-signing-kms-key-version:
        type: string
        default: ''
      jsign-version:
        type: string
        default: '7.5'
      jsign-sha256:
        type: string
        default: '602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c'
      windows-signing-timestamp-url:
        type: string
        default: 'http://timestamp.digicert.com'
    secrets:
      GCP_CODE_SIGNING_PROJECT_ID:
        required: false
      GCP_CODE_SIGNING_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_CODE_SIGNING_SERVICE_ACCOUNT:
        required: false
      GCP_CODE_SIGNING_KMS_KEY_VERSION:
        required: false
      GCP_CODE_SIGNING_CERTIFICATE_BASE64:
        required: false
      GCP_CODE_SIGNING_INTERMEDIATE_1_BASE64:
        required: false
      GCP_CODE_SIGNING_INTERMEDIATE_2_BASE64:
        required: false
      APPLE_BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_ID_PASSWORD:
        required: false
      NOTARIZE_TOOL:
        required: false
      TEAM_ID:
        required: false

defaults:
  run:
    # -l: use login shell (required when using Conda)
    shell: bash -l {0}

jobs:
  electron-build:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.os-version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check Windows signing configuration
        id: windows-signing
        if: runner.os == 'Windows' && inputs.sign-distribution
        shell: pwsh
        env:
          GCP_PROJECT_ID: ${{ inputs.gcp-code-signing-project-id || secrets.GCP_CODE_SIGNING_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.gcp-code-signing-workload-identity-provider || secrets.GCP_CODE_SIGNING_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ inputs.gcp-code-signing-service-account || secrets.GCP_CODE_SIGNING_SERVICE_ACCOUNT }}
          GCP_KMS_KEY_VERSION: ${{ inputs.gcp-code-signing-kms-key-version || secrets.GCP_CODE_SIGNING_KMS_KEY_VERSION }}
          LEAF_BASE64: ${{ secrets.GCP_CODE_SIGNING_CERTIFICATE_BASE64 }}
          INTERMEDIATE_1_BASE64: ${{ secrets.GCP_CODE_SIGNING_INTERMEDIATE_1_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredVariables = [ordered]@{
            'gcp-code-signing-project-id' = $env:GCP_PROJECT_ID
            'gcp-code-signing-workload-identity-provider' = $env:GCP_WORKLOAD_IDENTITY_PROVIDER
            'gcp-code-signing-service-account' = $env:GCP_SERVICE_ACCOUNT
            'gcp-code-signing-kms-key-version' = $env:GCP_KMS_KEY_VERSION
          }

          $requiredSecrets = [ordered]@{
            'GCP_CODE_SIGNING_CERTIFICATE_BASE64' = $env:LEAF_BASE64
            'GCP_CODE_SIGNING_INTERMEDIATE_1_BASE64' = $env:INTERMEDIATE_1_BASE64
          }

          $missingVariables = @()
          foreach ($item in $requiredVariables.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($item.Value)) {
              $missingVariables += $item.Key
            }
          }

          if ($missingVariables.Count -eq $requiredVariables.Count) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'enabled=false'
            Write-Host 'Windows signing skipped because no Google Cloud code signing repository variables are available.'
            exit 0
          }

          if ($missingVariables.Count -gt 0) {
            throw "Windows signing configuration is incomplete. Missing repository variables: $($missingVariables -join ', ')"
          }

          $missingSecrets = @()
          foreach ($item in $requiredSecrets.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($item.Value)) {
              $missingSecrets += $item.Key
            }
          }

          if ($missingSecrets.Count -gt 0) {
            throw "Windows signing configuration is incomplete. Missing repository or environment secrets: $($missingSecrets -join ', ')"
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value 'enabled=true'

      - name: Debug GitHub OIDC claims
        if: steps.windows-signing.outputs.enabled == 'true' && inputs.debug-oidc-claims
        shell: pwsh
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.gcp-code-signing-workload-identity-provider || secrets.GCP_CODE_SIGNING_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "github.repository: ${{ github.repository }}"
          Write-Host "github.repository_owner: ${{ github.repository_owner }}"
          Write-Host "github.ref: ${{ github.ref }}"
          Write-Host "github.workflow_ref: ${{ github.workflow_ref }}"
          Write-Host "github.event_name: ${{ github.event_name }}"

          if ([string]::IsNullOrWhiteSpace($env:ACTIONS_ID_TOKEN_REQUEST_URL) -or [string]::IsNullOrWhiteSpace($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)) {
            throw 'GitHub OIDC request environment variables are missing. Confirm this job has id-token: write.'
          }

          if ([string]::IsNullOrWhiteSpace($env:GCP_WORKLOAD_IDENTITY_PROVIDER)) {
            throw 'GCP workload identity provider is empty.'
          }

          $audience = "https://iam.googleapis.com/$env:GCP_WORKLOAD_IDENTITY_PROVIDER"
          $encodedAudience = [System.Uri]::EscapeDataString($audience)
          $oidcUri = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$encodedAudience"
          $response = Invoke-RestMethod -Uri $oidcUri -Headers @{
            Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
            Accept = 'application/json'
          }

          if ([string]::IsNullOrWhiteSpace($response.value)) {
            throw 'GitHub OIDC token response did not include a token value.'
          }

          $tokenParts = $response.value.Split('.')
          if ($tokenParts.Count -lt 2) {
            throw 'GitHub OIDC token did not include a JWT payload.'
          }

          $payload = $tokenParts[1].Replace('-', '+').Replace('_', '/')
          switch ($payload.Length % 4) {
            0 { }
            2 { $payload += '==' }
            3 { $payload += '=' }
            default { throw 'GitHub OIDC token payload has invalid base64url padding.' }
          }

          $claims = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json

          Write-Host "oidc.repository: $($claims.repository)"
          Write-Host "oidc.repository_owner: $($claims.repository_owner)"
          Write-Host "oidc.ref: $($claims.ref)"
          Write-Host "oidc.workflow_ref: $($claims.workflow_ref)"
          Write-Host "oidc.job_workflow_ref: $($claims.job_workflow_ref)"
          Write-Host "oidc.event_name: $($claims.event_name)"
          Write-Host "oidc.aud: $($claims.aud)"
          Write-Host "oidc.sub: $($claims.sub)"

      - name: Prepare Jsign KMS parameters
        id: jsign-kms
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          GCP_KMS_KEY_VERSION: ${{ inputs.gcp-code-signing-kms-key-version || secrets.GCP_CODE_SIGNING_KMS_KEY_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'

          $match = [regex]::Match(
            $env:GCP_KMS_KEY_VERSION,
            '^projects/(?<project>[^/]+)/locations/(?<location>[^/]+)/keyRings/(?<keyring>[^/]+)/cryptoKeys/(?<key>[^/]+)/cryptoKeyVersions/(?<version>[^/]+)$'
          )

          if (-not $match.Success) {
            throw 'GCP KMS key version must use projects/PROJECT_ID/locations/LOCATION/keyRings/KEYRING/cryptoKeys/KEY/cryptoKeyVersions/VERSION.'
          }

          $project = $match.Groups['project'].Value
          $location = $match.Groups['location'].Value
          $keyring = $match.Groups['keyring'].Value
          $key = $match.Groups['key'].Value
          $version = $match.Groups['version'].Value
          $keystore = "projects/$project/locations/$location/keyRings/$keyring"
          $alias = "$key/cryptoKeyVersions/$version"

          Add-Content -Path $env:GITHUB_OUTPUT -Value "keystore=$keystore"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "alias=$alias"

      - name: Preflight Google Cloud authentication
        id: google-auth-preflight
        if: steps.windows-signing.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.gcp-code-signing-project-id || secrets.GCP_CODE_SIGNING_PROJECT_ID }}
          workload_identity_provider: ${{ inputs.gcp-code-signing-workload-identity-provider || secrets.GCP_CODE_SIGNING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ inputs.gcp-code-signing-service-account || secrets.GCP_CODE_SIGNING_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Preflight Google Cloud KMS access
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          GCP_KMS_KEY_VERSION: ${{ inputs.gcp-code-signing-kms-key-version || secrets.GCP_CODE_SIGNING_KMS_KEY_VERSION }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth-preflight.outputs.access_token }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_ACCESS_TOKEN)) {
            throw 'Google Cloud authentication preflight did not return an access token.'
          }

          $headers = @{
            Authorization = "Bearer $env:GOOGLE_ACCESS_TOKEN"
          }
          $publicKeyUri = "https://cloudkms.googleapis.com/v1/$env:GCP_KMS_KEY_VERSION/publicKey"

          Invoke-RestMethod -Method Get -Uri $publicKeyUri -Headers $headers | Out-Null

      - name: Prepare Jsign certificate chain
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          LEAF_BASE64: ${{ secrets.GCP_CODE_SIGNING_CERTIFICATE_BASE64 }}
          INTERMEDIATE_1_BASE64: ${{ secrets.GCP_CODE_SIGNING_INTERMEDIATE_1_BASE64 }}
          INTERMEDIATE_2_BASE64: ${{ secrets.GCP_CODE_SIGNING_INTERMEDIATE_2_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Import-CertificateSecret {
            param(
              [string]$Name,
              [string]$Base64Value
            )

            if ([string]::IsNullOrWhiteSpace($Name)) {
              throw 'Certificate input name is empty.'
            }

            if ([string]::IsNullOrWhiteSpace($Base64Value)) {
              throw "${Name} certificate secret is empty."
            }

            $path = Join-Path $env:RUNNER_TEMP "$Name.cer"
            $normalized = $Base64Value -replace '\s', ''

            try {
              [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($normalized))
            } catch {
              throw "Failed to decode ${Name} certificate secret as base64: $($_.Exception.Message)"
            }

            $certificates = [Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
            $importedCertificates = @()
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($path))

            try {
              if ($text -match '-----BEGIN CERTIFICATE-----') {
                $pemCertificates = [regex]::Matches(
                  $text,
                  '-----BEGIN CERTIFICATE-----\s*(?<body>[A-Za-z0-9+/=\r\n]+?)\s*-----END CERTIFICATE-----'
                )

                if ($pemCertificates.Count -eq 0) {
                  throw "Found a PEM certificate header in ${Name}, but no complete certificate block."
                }

                foreach ($pemCertificate in $pemCertificates) {
                  $pemBody = $pemCertificate.Groups['body'].Value -replace '\s', ''
                  $certificateBytes = [Convert]::FromBase64String($pemBody)
                  $importedCertificates += [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificateBytes)
                }
              } elseif ($text -match '-----BEGIN (PKCS7|PKCS #7 SIGNED DATA)-----') {
                $pkcs7 = [regex]::Match(
                  $text,
                  '-----BEGIN (?:PKCS7|PKCS #7 SIGNED DATA)-----\s*(?<body>[A-Za-z0-9+/=\r\n]+?)\s*-----END (?:PKCS7|PKCS #7 SIGNED DATA)-----'
                )
                if (-not $pkcs7.Success) {
                  throw "Failed to parse ${Name} PEM PKCS#7 content."
                }

                $pkcs7Body = $pkcs7.Groups['body'].Value -replace '\s', ''
                $certificates.Import([Convert]::FromBase64String($pkcs7Body))
              } else {
                $certificates.Import($path)
              }
            } catch {
              throw "Failed to import ${Name} certificate material. Store the base64 of a .cer, .pem, .p7b, or .spc file: $($_.Exception.Message)"
            }

            if ($certificates.Count -eq 0) {
              if ($importedCertificates.Count -eq 0) {
                throw "No certificates were found in ${Name} certificate material."
              }
            } else {
              foreach ($certificate in $certificates) {
                $importedCertificates += $certificate
              }
            }

            return $importedCertificates
          }

          $allCertificates = [Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()

          $certificateInputs = @(
            @{ Name = 'leaf'; Value = $env:LEAF_BASE64 },
            @{ Name = 'intermediate-1'; Value = $env:INTERMEDIATE_1_BASE64 }
          )

          if (-not [string]::IsNullOrWhiteSpace($env:INTERMEDIATE_2_BASE64)) {
            $certificateInputs += @{ Name = 'intermediate-2'; Value = $env:INTERMEDIATE_2_BASE64 }
          }

          foreach ($certificateInput in $certificateInputs) {
            $importedCertificates = @(
              Import-CertificateSecret `
                -Name $certificateInput.Name `
                -Base64Value $certificateInput.Value
            )

            foreach ($certificate in $importedCertificates) {
              [void]$allCertificates.Add($certificate)
            }
          }

          if ($allCertificates.Count -eq 0) {
            throw 'No certificates were available for Jsign.'
          }

          $chainPath = Join-Path $env:RUNNER_TEMP 'code-signing-chain.p7b'
          $chainBytes = $allCertificates.Export([Security.Cryptography.X509Certificates.X509ContentType]::Pkcs7)
          if ($null -eq $chainBytes -or $chainBytes.Length -eq 0) {
            throw 'Failed to export the Jsign certificate chain as PKCS#7.'
          }
          [IO.File]::WriteAllBytes($chainPath, $chainBytes)

          Add-Content -Path $env:GITHUB_ENV -Value "GCP_SIGNING_CERTIFICATE_CHAIN=$chainPath"
          Write-Host "Prepared Jsign PKCS#7 certificate chain with $($allCertificates.Count) certificate(s): $chainPath"

      - name: Set up Java for Jsign
        if: steps.windows-signing.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Jsign
        id: jsign
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          JSIGN_VERSION: ${{ inputs.jsign-version }}
          JSIGN_SHA256: ${{ inputs.jsign-sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:JSIGN_VERSION)) {
            throw 'JSIGN_VERSION is empty.'
          }

          $version = $env:JSIGN_VERSION.TrimStart('v')
          $jarName = "jsign-$version.jar"
          $jarPath = Join-Path $env:RUNNER_TEMP $jarName
          $downloadUrl = "https://github.com/ebourg/jsign/releases/download/$version/$jarName"

          Write-Host "Downloading Jsign $version from $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $jarPath

          if (-not [string]::IsNullOrWhiteSpace($env:JSIGN_SHA256)) {
            $expectedDigest = $env:JSIGN_SHA256.Trim().ToLowerInvariant()
            $actualDigest = (Get-FileHash -Algorithm SHA256 -Path $jarPath).Hash.ToLowerInvariant()
            Write-Host "Jsign SHA256: $actualDigest"
            if ($actualDigest -ne $expectedDigest) {
              throw "Downloaded Jsign digest mismatch. Expected $expectedDigest; got $actualDigest."
            }
          } else {
            Write-Warning 'No JSIGN_SHA256 value was provided; skipping Jsign download verification.'
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$jarPath"

          & java -jar $jarPath --version

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: pareto-ui-env
          miniforge-version: 25.3.1-0

      ## handle Apple certificate, keychain setup for mac builds
      - name: Install the Apple certificate
        if: runner.os == 'macOS' && inputs.sign-distribution && env.BUILD_CERTIFICATE_BASE64 != '' && env.P12_PASSWORD != '' && env.KEYCHAIN_PASSWORD != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      ## use this for naming package
      - name: Generate Package Build Number
        id: generate-build-number
        run: |
          if [ -z "${{ inputs.package-build-number }}" ]; then
            echo "build-number=$(date +'%y.%m.%d')" >> $GITHUB_OUTPUT
          else
            echo "build-number=${{ inputs.package-build-number }}" >> $GITHUB_OUTPUT
          fi

      ## Generate os name, artifact file name, extensions
      ## For build type of zip, we build it unpacked so it can be codesigned before being zipped up
      - name: Generate os name, file extension, artifact path
        id: dynamic-variables
        run: |
          if [ "${{ inputs.os-version }}" == "windows-latest" ]; then
            echo "os=win64" >> $GITHUB_OUTPUT
            if [ "${{ inputs.windows-installer-target }}" == "zip" ]; then
              echo "artifact-file-extension=zip" >> $GITHUB_OUTPUT
              echo "build-label=portable" >> $GITHUB_OUTPUT
              echo "build-target=dir" >> $GITHUB_OUTPUT
              echo "artifact-name=PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_win64_portable" >> $GITHUB_OUTPUT
              echo "final-artifact=PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_win64_portable" >> $GITHUB_OUTPUT
            elif [ "${{ inputs.windows-installer-target }}" == "portable" ]; then
              echo "artifact-file-extension=exe" >> $GITHUB_OUTPUT
              echo "build-label=portable" >> $GITHUB_OUTPUT
              echo "build-target=portable" >> $GITHUB_OUTPUT
              echo "artifact-name=PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_win64_portable" >> $GITHUB_OUTPUT
              echo "final-artifact=PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_win64_portable.exe" >> $GITHUB_OUTPUT
            else
              echo "artifact-file-extension=exe" >> $GITHUB_OUTPUT
              echo "build-label=nsis" >> $GITHUB_OUTPUT
              echo "build-target=nsis" >> $GITHUB_OUTPUT
              echo "artifact-name=PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_win64_nsis" >> $GITHUB_OUTPUT
              echo "final-artifact=PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_win64_nsis.exe" >> $GITHUB_OUTPUT
            fi
          else
            echo "os=arm64" >> $GITHUB_OUTPUT
            echo "artifact-file-extension=dmg" >> $GITHUB_OUTPUT
            echo "build-label=dmg" >> $GITHUB_OUTPUT
            echo "build-target=dmg" >> $GITHUB_OUTPUT
            echo "artifact-name=PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_arm64" >> $GITHUB_OUTPUT
            echo "final-artifact=PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_arm64.dmg" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json with correct build version, name
        uses: restackio/update-json-file-action@2.1
        with:
          file: ./electron/package.json
          fields: "{\"version\": \"${{ steps.generate-build-number.outputs.build-number }}\", \"build.win.artifactName\": \"PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_${{ steps.dynamic-variables.outputs.os }}_${{ steps.dynamic-variables.outputs.build-label }}.exe\", \"build.mac.artifactName\": \"PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_${{ steps.dynamic-variables.outputs.os }}.${{ steps.dynamic-variables.outputs.build-target }}\", \"build.nsis.artifactName\": \"PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_${{ steps.dynamic-variables.outputs.os }}_${{ steps.dynamic-variables.outputs.build-label }}.exe\", \"build.dmg.artifactName\": \"PARETO-UI_${{ steps.generate-build-number.outputs.build-number }}_${{ steps.dynamic-variables.outputs.os }}.dmg\", \"build.win.target\": \"${{ steps.dynamic-variables.outputs.build-target }}\"}"

      ## TODO: update this step (and the pareto hook) to remove reliance on local installation of pareto
      - name: Install project pareto locally
        working-directory: ../
        run: git clone https://github.com/${{ inputs.project-pareto-repo }}.git && cd project-pareto && git fetch --all --tags && git checkout ${{ inputs.project-pareto-branch }} && pip install --progress-bar off .

      - name: install Python packages
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Add project pareto version to .env file
        working-directory: ./electron/ui
        run: |
          echo REACT_APP_PARETO_VERSION=${{ inputs.project-pareto-version }} >> .env

      - name: Add project pareto version to .env file
        working-directory: ./electron/ui
        run: |
          echo REACT_APP_BUILD_NUMBER=${{ steps.generate-build-number.outputs.build-number }} >> .env

      - name: Install Electron JS dependencies
        working-directory: ./electron
        run: npm install

      - name: Install frontend JS dependencies
        working-directory: ./electron/ui
        run: npm clean-install

      - name: Add backend .env file
        working-directory: backend/app
        run: |
          echo production=true >> .env

      - name: Get idaes extensions
        working-directory: backend/app
        run: |
          mkdir idaes_extensions
          idaes get-extensions --to ./idaes_extensions

      - name: DEBUG - pip freeze
        run: pip freeze

      - name: Build Backend
        working-directory: ./electron
        run: npm run build-backend

      - name: Build Frontend
        working-directory: ./electron
        env:
          CI: false
        run: npm run build-frontend

      - name: Build ${{ steps.dynamic-variables.outputs.os }} Distribution
        env:
          SIGN_DISTRIBUTION: ${{ inputs.sign-distribution }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          NOTARIZE_TOOL: ${{ secrets.NOTARIZE_TOOL }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        working-directory: ./electron
        run: |
          if [ "${{ steps.dynamic-variables.outputs.os }}" = "arm64" ]; then
            if [ "${SIGN_DISTRIBUTION}" != "true" ]; then
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset APPLE_ID APPLE_ID_PASSWORD NOTARIZE_TOOL TEAM_ID
            fi
            npm run electron-build-mac
          else
            npm run electron-build-win
          fi

      - name: Authenticate to Google Cloud
        id: google-auth
        if: steps.windows-signing.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.gcp-code-signing-project-id || secrets.GCP_CODE_SIGNING_PROJECT_ID }}
          workload_identity_provider: ${{ inputs.gcp-code-signing-workload-identity-provider || secrets.GCP_CODE_SIGNING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ inputs.gcp-code-signing-service-account || secrets.GCP_CODE_SIGNING_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Sign Windows Distribution with Jsign
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ steps.dynamic-variables.outputs.artifact-name }}
          DIST_DIR: electron/dist
          FINAL_ARTIFACT: ${{ steps.dynamic-variables.outputs.final-artifact }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          JSIGN_ALIAS: ${{ steps.jsign-kms.outputs.alias }}
          JSIGN_JAR: ${{ steps.jsign.outputs.path }}
          JSIGN_KEYSTORE: ${{ steps.jsign-kms.outputs.keystore }}
          TIMESTAMP_URL: ${{ inputs.windows-signing-timestamp-url }}
          WINDOWS_INSTALLER_TARGET: ${{ inputs.windows-installer-target }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_ACCESS_TOKEN)) {
            throw 'Google Cloud authentication did not return an access token for Jsign.'
          }

          if (-not (Test-Path -LiteralPath $env:JSIGN_JAR)) {
            throw "Jsign JAR does not exist: $env:JSIGN_JAR"
          }

          if (-not (Test-Path -LiteralPath $env:GCP_SIGNING_CERTIFICATE_CHAIN)) {
            throw "Jsign certificate chain does not exist: $env:GCP_SIGNING_CERTIFICATE_CHAIN"
          }

          $repoPath = (Get-Location).Path
          $distPath = Join-Path $repoPath $env:DIST_DIR
          $artifactPath = Join-Path $distPath $env:FINAL_ARTIFACT

          function Invoke-CodeSigning {
            param([string]$Path)

            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "File does not exist: $Path"
            }

            Write-Host "Signing artifact: $Path"

            $jsignArgs = @(
              '--storetype', 'GOOGLECLOUD',
              '--keystore', $env:JSIGN_KEYSTORE,
              '--storepass', 'env:GOOGLE_ACCESS_TOKEN',
              '--alias', $env:JSIGN_ALIAS,
              '--certfile', $env:GCP_SIGNING_CERTIFICATE_CHAIN,
              '--alg', 'SHA-256',
              '--tsaurl', $env:TIMESTAMP_URL,
              '--tsmode', 'RFC3161',
              '--tsretries', '3',
              '--tsretrywait', '10',
              $Path
            )

            & java -jar $env:JSIGN_JAR @jsignArgs

            if ($LASTEXITCODE -ne 0) {
              throw "Jsign failed with exit code $LASTEXITCODE."
            }
          }

          Write-Host "Timestamp URL: $env:TIMESTAMP_URL"

          if ($env:WINDOWS_INSTALLER_TARGET -eq 'zip') {
            $unpackedPath = Join-Path $distPath 'win-unpacked'
            $portablePath = Join-Path $distPath $env:ARTIFACT_NAME

            if (Test-Path -LiteralPath $unpackedPath -PathType Container) {
              if (Test-Path -LiteralPath $portablePath) {
                throw "Cannot move $unpackedPath to $portablePath because the target already exists."
              }

              Move-Item -LiteralPath $unpackedPath -Destination $portablePath
            } elseif (-not (Test-Path -LiteralPath $portablePath -PathType Container)) {
              throw "Windows unpacked artifact does not exist: $unpackedPath"
            }

            $filesToSign = @(
              Get-ChildItem -LiteralPath $portablePath -Recurse -File |
                Where-Object { $_.Extension -in @('.exe', '.dll') }
            )

            if ($filesToSign.Count -eq 0) {
              throw "No .exe or .dll files were found to sign under $portablePath."
            }

            foreach ($file in $filesToSign) {
              Invoke-CodeSigning -Path $file.FullName
            }
          } else {
            Invoke-CodeSigning -Path $artifactPath
          }

      - name: Verify Windows Signature with SignTool
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ steps.dynamic-variables.outputs.artifact-name }}
          DIST_DIR: electron/dist
          FINAL_ARTIFACT: ${{ steps.dynamic-variables.outputs.final-artifact }}
          WINDOWS_INSTALLER_TARGET: ${{ inputs.windows-installer-target }}
        run: |
          $ErrorActionPreference = 'Stop'

          $repoPath = (Get-Location).Path
          $distPath = Join-Path $repoPath $env:DIST_DIR
          $artifactPath = Join-Path $distPath $env:FINAL_ARTIFACT

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signTool) {
            throw 'Could not locate the x64 Windows SDK signtool.exe.'
          }

          function Test-CodeSignature {
            param([string]$Path)

            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "File does not exist: $Path"
            }

            $signature = Get-AuthenticodeSignature -FilePath $Path
            Write-Host "PowerShell Authenticode status for ${Path}: $($signature.Status)"
            if ($signature.SignerCertificate) {
              Write-Host "Signer subject: $($signature.SignerCertificate.Subject)"
              Write-Host "Signer issuer: $($signature.SignerCertificate.Issuer)"
              Write-Host "Signer thumbprint: $($signature.SignerCertificate.Thumbprint)"
            }
            if ($signature.TimeStamperCertificate) {
              Write-Host "Timestamp subject: $($signature.TimeStamperCertificate.Subject)"
            }

            & $signTool verify /pa /all /v /tw $Path
            if ($LASTEXITCODE -ne 0) {
              throw "SignTool verification failed with exit code $LASTEXITCODE."
            }
          }

          if ($env:WINDOWS_INSTALLER_TARGET -eq 'zip') {
            $portablePath = Join-Path $distPath $env:ARTIFACT_NAME
            if (-not (Test-Path -LiteralPath $portablePath -PathType Container)) {
              throw "Windows portable artifact does not exist: $portablePath"
            }

            $signedFiles = @(
              Get-ChildItem -LiteralPath $portablePath -Recurse -File |
                Where-Object { $_.Extension -in @('.exe', '.dll') }
            )

            if ($signedFiles.Count -eq 0) {
              throw "No .exe or .dll files were found to verify under $portablePath."
            }

            foreach ($file in $signedFiles) {
              Test-CodeSignature -Path $file.FullName
            }
          } else {
            Test-CodeSignature -Path $artifactPath
          }

      - name: Upload artifact for ${{ steps.dynamic-variables.outputs.os }} build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: ${{ steps.dynamic-variables.outputs.artifact-name }}
          path: electron/dist/${{ steps.dynamic-variables.outputs.final-artifact }}
